name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (build + clippy + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: Check Daemon RAM usage
        shell: powershell
        run: |
          Start-Process -FilePath "target\debug\zero-daemon.exe" -NoNewWindow
          Start-Sleep -Seconds 3
          $mem = (Get-Process zero-daemon).WorkingSet64 / 1MB
          Stop-Process -Name zero-daemon -Force
          if ($mem -gt 50) { Write-Error "RAM > 50MB: $mem MB"; exit 1 }
          Write-Output "RAM usage OK: $mem MB"

  server:
    name: NestJS (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zero-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zero-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  studio:
    name: Tauri build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zero-studio/src-tauri
      - working-directory: zero-studio
        run: npm install
      - working-directory: zero-studio
        run: npx tauri build
      - name: Check Installer size
        shell: powershell
        working-directory: zero-studio
        run: |
          $msi = Get-ChildItem src-tauri\target\release\bundle\msi\*.msi
          $size = $msi.Length / 1MB
          if ($size -gt 15) { Write-Error "Installer > 15MB: $size MB"; exit 1 }
          Write-Output "Installer size OK: $size MB"
