# Standalone crate — kept out of the root Cargo workspace (Tauri manages its own build).
[workspace]

[package]
name = "zero-studio"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
dirs = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }
