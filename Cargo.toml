[workspace]
resolver = "2"
members = [
    "zero-daemon",
    "tools/stt-bench",
    "right-panel-main",
]
# zero-studio/src-tauri is intentionally NOT a workspace member (see CLAUDE.md):
# Tauri manages its own cargo build.
exclude = [
    "zero-studio/src-tauri",
]

# Size-focused build for right-panel (moved from its own Cargo.toml, where
# member profiles are ignored). `lto` and `panic` cannot be set per-package,
# and a workspace-wide panic=abort would affect zero-daemon, so they are omitted.
[profile.release.package.right-panel]
opt-level = "z"
codegen-units = 1
strip = true
